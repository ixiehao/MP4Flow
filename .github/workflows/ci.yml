name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  build:
    runs-on: macos-14
    steps:
      # Pinned commit for actions/checkout v7.0.1. Update deliberately through Dependabot.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: Validate website
        run: |
          node --check website/app.js
          node --test Scripts/tests/website.test.mjs
      - name: Build release binary
        run: swift build -c release
      - name: Validate localizations and metadata
        run: |
          ./Scripts/validate-localizations.sh
          python3 -m unittest discover -s Scripts/tests -v
      - name: Install synthetic-media test dependency
        run: brew list ffmpeg >/dev/null 2>&1 || brew install ffmpeg
      - name: Run Swift tests
        run: swift test
      - name: Run synthetic media regression matrix
        run: ./Scripts/run-media-regression.sh
