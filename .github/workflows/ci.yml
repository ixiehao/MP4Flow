name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  build:
    runs-on: macos-14
    steps:
      # Pinned commit for actions/checkout v4.2.2. Update deliberately through Dependabot.
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - name: Build release binary
        run: swift build -c release
      - name: Validate localizations and metadata
        run: ./Scripts/validate-localizations.sh
