name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  build:
    runs-on: macos-14
    steps:
      # Pinned commit for actions/checkout v4.2.2. Update deliberately through Dependabot.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: Build release binary
        run: swift build -c release
      - name: Validate localizations and metadata
        run: ./Scripts/validate-localizations.sh
