changelog:
  categories:
    - title: ✨ New features / 新機能 / 新功能
      labels:
        - enhancement
    - title: 🐛 Fixes / 修正 / 修复
      labels:
        - bug
    - title: ♿ Accessibility / アクセシビリティ / 无障碍
      labels:
        - accessibility
    - title: 📚 Documentation / ドキュメント / 文档
      labels:
        - documentation
  exclude:
    labels:
      - dependencies
      - skip-changelog
    authors:
      - dependabot[bot]
